name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gettext (msgfmt)
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Byte-compile sources
        run: python -m py_compile __init__.py action.py config.py

      - name: Validate PO files
        run: |
          for po in translations/*.po; do
            echo "Checking $po"
            msgfmt --check "$po" -o /dev/null
          done

      - name: Verify .pot is up to date
        run: |
          # Re-extract msgids from source and compare the set with the committed .pot.
          python - <<'PY'
          import re, sys
          pat = re.compile(r"""_\(\s*(['"])(.*?)\1\s*\)""")
          src_ids = set()
          for f in ("__init__.py", "action.py", "config.py"):
              for m in pat.finditer(open(f, encoding="utf-8").read()):
                  if m.group(2):
                      src_ids.add(m.group(2))

          pot_ids = set()
          msgid = None
          for line in open("translations/send_to_calibre_web.pot", encoding="utf-8"):
              line = line.rstrip("\n")
              if line.startswith("msgid "):
                  val = line[6:].strip()
                  try:
                      msgid = eval(val)
                  except Exception:
                      msgid = ""
              elif line.startswith('"') and msgid is not None:
                  try:
                      msgid += eval(line)
                  except Exception:
                      pass
              elif line.startswith("msgstr") and msgid:
                  pot_ids.add(msgid)
                  msgid = None

          missing = src_ids - pot_ids
          if missing:
              print("ERROR: these source strings are missing from the .pot:")
              for s in sorted(missing):
                  print("  -", s)
              print("\nRegenerate the template and commit it.")
              sys.exit(1)
          print(f"OK: all {len(src_ids)} source strings are present in the .pot.")
          PY

      - name: Build plugin zip
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify zip layout
        run: |
          # The import-name marker and __init__.py must be at the zip root.
          unzip -l send-to-calibre-web.zip
          unzip -l send-to-calibre-web.zip | grep -q ' __init__.py$'
          unzip -l send-to-calibre-web.zip | grep -q 'plugin-import-name-send_to_calibre_web.txt$'
          unzip -l send-to-calibre-web.zip | grep -q 'translations/pt.mo$'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: send-to-calibre-web
          path: send-to-calibre-web.zip
          if-no-files-found: error
